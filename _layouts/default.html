<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description | strip_newlines }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/assets/sm_50.gif' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#2563eb">
  <meta name="site-base" content="{{ '' | relative_url }}">
  
  <script>
    (function() {
      var saved = localStorage.getItem('piggii_theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark-theme');
      } else if (saved === 'light') {
        document.documentElement.classList.add('light-theme');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>
  
  {% feed_meta %}
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="site-branding">
        <a href="{{ '/' | relative_url }}" class="site-title">piggii</a>
        <p class="site-tagline">{{ site.data.settings.tagline | default: "Personal blog, thoughts, and projects." }}</p>
      </div>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url contains '/archive' %}class="active"{% endif %}>Archive</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
          <span id="theme-icon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="main-container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-top">
        <div class="mini-player">
          <div class="player-info">
            <span class="player-icon">🎵</span>
            <span id="player-track-name">Music Player</span>
            <span id="player-track-artist" class="track-artist"></span>
          </div>
          <div class="player-actions">
            <button id="btn-prev" title="Previous" aria-label="Previous track">&lt;</button>
            <button id="btn-play" title="Play/Pause" aria-label="Play">&gt;</button>
            <button id="btn-next" title="Next" aria-label="Next track">&gt;&gt;</button>
          </div>
          <div id="player-progress"><div id="player-progress-bar"></div></div>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; {{ 'now' | date: '%Y' }} piggii &middot; Built with Jekyll &amp; Markdown</p>
        <p class="footer-links">
          <a href="{{ '/admin/' | relative_url }}">Admin</a> &middot;
          <a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a>
        </p>
      </div>
    </div>
  </footer>

  <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
